# LUMI Hardware Mapping & Calibration Configuration
# Calibrated & Tested on Real Hardware:
# Channel 0: Head (up/down tilt): -15° = up, +15° = down
# Channel 1: Right hand, Y-axis (front/back): +25° = back, -60° = front
# Channel 2: Left hand, Y-axis (front/back): -25° = back, +60° = front
# Channel 3: Right hand, X-axis (up/down): -25° = up, +5° = down
# Channel 4: Left hand, X-axis (up/down): +25° = up, -5° = down
# Channel 5: Body (waist rotation): -90° = right, +90° = left

servo_driver:
  model: "PCA9685"          # Configurable driver model
  i2c_bus: 1
  i2c_address: 0x40
  pwm_frequency_hz: 50

channels:
  head_tilt:
    channel: 0
    min_angle: -15
    max_angle: 15
    home_angle: 0
    min_pulse_us: 500
    max_pulse_us: 2500
    inverted: false

  right_arm_y:
    channel: 1
    min_angle: -60
    max_angle: 25
    home_angle: 0
    min_pulse_us: 500
    max_pulse_us: 2500
    inverted: false

  left_arm_y:
    channel: 2
    min_angle: -25
    max_angle: 60
    home_angle: 0
    min_pulse_us: 500
    max_pulse_us: 2500
    inverted: false

  right_arm_x:
    channel: 3
    min_angle: -25
    max_angle: 5
    home_angle: 0
    min_pulse_us: 500
    max_pulse_us: 2500
    inverted: false

  left_arm_x:
    channel: 4
    min_angle: -5
    max_angle: 25
    home_angle: 0
    min_pulse_us: 500
    max_pulse_us: 2500
    inverted: false

  head_pan:
    channel: 5
    min_angle: -90
    max_angle: 90
    home_angle: 0
    min_pulse_us: 500
    max_pulse_us: 2500
    inverted: false

displays:
  left_eye:
    spi_bus: 0
    spi_device: 0
    dc_pin: 24
    rst_pin: 25
    bl_pin: 18

  right_eye:
    spi_bus: 0
    spi_device: 1
    dc_pin: 23
    rst_pin: 22
    bl_pin: 18

audio_i2s:
  bclk_pin: 18
  lrclk_pin: 19
  dout_pin: 21
